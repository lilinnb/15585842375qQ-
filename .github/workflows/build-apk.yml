name: Build Xiaobai Island APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract ZIP
        run: |
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "找不到源码ZIP文件"
            exit 1
          fi
          mkdir source
          unzip -q "$ZIP" -d source
          GRADLEW=$(find source -name gradlew -type f | head -n 1)
          if [ -z "$GRADLEW" ]; then
            echo "ZIP里面找不到gradlew"
            exit 1
          fi
          PROJECT_DIR=$(dirname "$GRADLEW")
         
