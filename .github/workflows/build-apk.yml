name: Build Xiaobai Island APK

on:
  workflow_dispatch:
  push:
    paths:
      - '*.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        run: |
          mkdir source
          ZIP=$(find . -maxdepth 1 -type f -iname '*.zip' | head -n 1)
          test -n "$ZIP"
          unzip -q "$ZIP" -d source
          PROJECT_DIR=$(find source -name settings.gradle.kts -type f -printf '%h\n' | head -n 1)
          test -n "$PROJECT_DIR"
          cd "$PROJECT_DIR"
          gradle assembleDebug
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp app/build/outputs/apk/debug/app-debug.apk "$GITHUB_WORKSPACE/output/"

      - uses: actions/upload-artifact@v4
        with:
          name: xiaobai-dongdao-apk
          path: output/app-debug.apk
